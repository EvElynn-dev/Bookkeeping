name: Deploy API

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to self-hosted server
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Download Android release artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: mobile-android-release
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Upload Android release to server
        if: github.event_name == 'workflow_run'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: "release/android/app-release.apk,release/update.json"
          target: "${{ secrets.DEPLOY_PATH }}"
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -eu
            cd "${{ secrets.DEPLOY_PATH }}"
            mkdir -p releases/android
            if [ -f release/android/app-release.apk ]; then
              mv release/android/app-release.apk releases/android/latest.apk
            fi
            if [ -f release/update.json ]; then
              mv release/update.json releases/update.json
            fi
            git fetch --prune origin main
            git reset --hard origin/main
            test -f server/.env
            docker compose up -d --build
            docker image prune -f
            curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
