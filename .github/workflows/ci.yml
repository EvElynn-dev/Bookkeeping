name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Check API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile API
        run: python -m compileall -q server/app

  mobile:
    name: Check mobile app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile app
        working-directory: mobile
        run: pnpm run typecheck
      - name: Validate Expo config
        working-directory: mobile
        run: pnpm exec expo config --type public --json > /tmp/expo-config.json
