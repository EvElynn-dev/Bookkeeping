name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Check API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install API dependencies
        run: python -m pip install -r server/requirements.txt
      - name: Compile API
        run: python -m compileall -q server/app

  mobile:
    name: Check mobile app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Typecheck mobile app
        working-directory: mobile
        run: pnpm run typecheck
      - name: Validate Expo config
        working-directory: mobile
        run: pnpm exec expo config --type public --json > /tmp/expo-config.json

  android-release:
    name: Build Android release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [server, mobile]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Build signed personal-use APK
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://103.85.227.193:8000
          NODE_ENV: production
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          ./android/gradlew -p android assembleRelease --no-daemon --console=plain
      - name: Prepare mobile release artifact
        working-directory: mobile
        run: |
          mkdir -p release/android
          cp android/app/build/outputs/apk/release/app-release.apk release/android/app-release.apk
          version="$(node -p "require('./app.json').expo.version")"
          version_code="$(sed -n "s/.*versionCode \([0-9][0-9]*\).*/\1/p" android/app/build.gradle | head -1)"
          sha256="$(sha256sum release/android/app-release.apk | cut -d ' ' -f 1)"
          cat > release/update.json <<EOF
          {
            "latest_version": "${version}",
            "latest_version_code": ${version_code:-1},
            "android_path": "/downloads/android/latest.apk",
            "ios_url": null,
            "sha256": "${sha256}",
            "notes": "Android 更新包已发布，下载后按系统提示安装。"
          }
          EOF
      - name: Upload Android release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-release
          path: mobile/release
          if-no-files-found: error
          retention-days: 14
